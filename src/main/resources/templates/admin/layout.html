<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Batch Admin">Batch Admin</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"
          integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar bg-dark">
            <div class="sidebar-header p-3">
                <h5 class="text-white mb-0">
                    <i class="bi bi-gear-fill me-2"></i>Batch Admin
                </h5>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.equals(currentPath, '/admin') ? 'active' : ''}" th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.startsWith(currentPath, '/admin/executions') ? 'active' : ''}" th:href="@{/admin/executions}">
                        <i class="bi bi-list-task me-2"></i>Executions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.equals(currentPath, '/admin/errors') ? 'active' : ''}" th:href="@{/admin/errors}">
                        <i class="bi bi-exclamation-triangle me-2"></i>Errors
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.equals(currentPath, '/admin/schedules') ? 'active' : ''}" th:href="@{/admin/schedules}">
                        <i class="bi bi-calendar-event me-2"></i>Schedules
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.equals(currentPath, '/admin/webhooks') ? 'active' : ''}" th:href="@{/admin/webhooks}">
                        <i class="bi bi-link-45deg me-2"></i>Webhooks
                    </a>
                </li>
            </ul>
            <hr class="text-secondary mx-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">
                        <i class="bi bi-book me-2"></i>API Docs
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content flex-grow-1">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
                <div class="container-fluid">
                    <span class="navbar-brand" layout:fragment="page-title">Dashboard</span>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="text-muted me-3" id="current-time"></span>
                        <span class="badge bg-warning text-dark me-2" id="api-key-badge">
                            <i class="bi bi-lock-fill me-1"></i>API Key 미설정
                        </span>
                        <button class="btn btn-outline-secondary btn-sm me-2" id="api-key-btn"
                                onclick="ApiKeyUi.openModal()">키 설정</button>
                        <button class="btn btn-outline-secondary btn-sm" onclick="location.reload()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="content-wrapper p-4" layout:fragment="content">
                <!-- Content will be replaced -->
            </div>
        </main>
    </div>

    <!-- API Key 입력 Modal (전 페이지 공용) -->
    <div class="modal fade" id="api-key-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">API Key 설정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="api-key-input">X-API-Key</label>
                    <input type="password" class="form-control" id="api-key-input" autocomplete="off">
                    <div class="form-text">이 탭에서만 유지됩니다. 탭을 닫으면 사라집니다.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="ApiKeyUi.save()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
            integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>

    <!-- Common JS -->
    <script th:src="@{/js/admin-common.js}"></script>

    <!-- Page-specific JS -->
    <th:block layout:fragment="scripts"></th:block>

    <script>
        // Update current time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const timeEl = document.getElementById('current-time');
            if (timeEl) {
                timeEl.textContent = timeStr;
            }
        }
        updateTime();
        setInterval(updateTime, 1000);

        // API Key 배지 초기 상태 반영
        document.addEventListener('DOMContentLoaded', function () {
            ApiKeyUi.refreshBadge();
        });

        // Enter 로 저장
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('api-key-input');
            if (input) {
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') ApiKeyUi.save();
                });
            }
        });
    </script>
</body>
</html>
