<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Schedules</title>
</head>
<body>
    <span layout:fragment="page-title">
        <i class="bi bi-calendar-event me-2"></i>Job Schedules
    </span>

    <div layout:fragment="content">
        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Total Schedules</h6>
                                <h3 class="mb-0" id="total-schedules">-</h3>
                            </div>
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-calendar3"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Enabled</h6>
                                <h3 class="mb-0 text-success" id="enabled-schedules">-</h3>
                            </div>
                            <div class="stat-icon bg-success bg-opacity-10 text-success">
                                <i class="bi bi-check-circle"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Disabled</h6>
                                <h3 class="mb-0 text-secondary" id="disabled-schedules">-</h3>
                            </div>
                            <div class="stat-icon bg-secondary bg-opacity-10 text-secondary">
                                <i class="bi bi-pause-circle"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Schedules Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0">
                <h5 class="mb-0">
                    <i class="bi bi-list me-2"></i>Schedule Configurations
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Job Name</th>
                                <th>Cron Expression</th>
                                <th>Timezone</th>
                                <th>Status</th>
                                <th>Last Triggered</th>
                                <th>Next Fire Time</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="schedules-table-body">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-hourglass-split"></i> Loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                loadSchedules();
            });

            async function loadSchedules() {
                const schedules = await AdminApi.get('/schedules');
                renderSchedules(schedules);
            }

            function renderSchedules(schedules) {
                // Update summary
                const enabled = schedules.filter(s => s.isEnabled).length;
                const disabled = schedules.filter(s => !s.isEnabled).length;
                document.getElementById('total-schedules').textContent = schedules.length;
                document.getElementById('enabled-schedules').textContent = enabled;
                document.getElementById('disabled-schedules').textContent = disabled;

                // Render table
                const tbody = document.getElementById('schedules-table-body');

                if (schedules.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox"></i> No schedules configured
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = schedules.map(schedule => `
                    <tr class="${schedule.isEnabled ? '' : 'table-secondary'}">
                        <td><strong>${schedule.jobName}</strong></td>
                        <td><code>${schedule.cronExpression}</code></td>
                        <td>${schedule.timezone}</td>
                        <td>
                            ${schedule.isEnabled
                                ? '<span class="badge bg-success">Enabled</span>'
                                : '<span class="badge bg-secondary">Disabled</span>'
                            }
                        </td>
                        <td>${schedule.lastTriggeredAt ? DateUtil.format(schedule.lastTriggeredAt) : '-'}</td>
                        <td>${schedule.nextFireTime ? DateUtil.format(schedule.nextFireTime) : '-'}</td>
                        <td class="text-muted">${schedule.description || '-'}</td>
                    </tr>
                `).join('');
            }
        </script>
    </th:block>
</body>
</html>
